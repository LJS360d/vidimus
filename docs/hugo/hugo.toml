baseURL = 'https://ljs360d.github.io/vidimus/hugo/'
languageCode = 'en'
title = 'vidimus'
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404', 'robotstxt']
enableGitInfo = false

[params]
  description = 'Pre-publication checks for static websites: accessibility, links, SEO, security headers, privacy, page weight and more, with a fix for every finding.'
  repo = 'https://github.com/LJS360d/vidimus'
  og = 'https://ljs360d.github.io/vidimus/og.png'

# The showcase page embeds raw HTML.
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  autoHeadingIDType = 'github'

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
