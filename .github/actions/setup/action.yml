name: setup
description: Install pnpm, Node and dependencies, and optionally the browser for the browser audits

inputs:
  node-version:
    description: Node.js version
    default: '24'
  browser:
    description: install the Chrome build that puppeteer expects
    default: 'false'
  docs-tools:
    description: install the non-npm docs generators pinned in mise.toml (Hugo, Zola, mdBook)
    default: 'false'

runs:
  using: composite
  steps:
    # The browsers are fetched explicitly below, after the cache is restored.
    - shell: bash
      run: echo 'PUPPETEER_SKIP_DOWNLOAD=true' >> "$GITHUB_ENV"
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.browser == 'true'
      id: puppeteer
      shell: bash
      run: echo "version=$(node -p "require('puppeteer/package.json').version")" >> "$GITHUB_OUTPUT"
    - if: inputs.browser == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-shell-${{ runner.os }}-${{ steps.puppeteer.outputs.version }}
        restore-keys: puppeteer-shell-${{ runner.os }}-
    - if: inputs.browser == 'true'
      shell: bash
      run: pnpm exec puppeteer browsers install chrome && pnpm exec puppeteer browsers install chrome-headless-shell
    - if: inputs.docs-tools == 'true'
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install_args: hugo zola mdbook
