name: setup
description: Install pnpm, Node and dependencies, and optionally the browser for the browser audits

inputs:
  node-version:
    description: Node.js version
    default: '24'
  browser:
    description: install the Chrome build that puppeteer expects
    default: 'false'
  docs-tools:
    description: install the non-npm docs generators pinned in mise.toml (Hugo, Zola, mdBook)
    default: 'false'

runs:
  using: composite
  steps:
    # The browser is fetched explicitly below, after the cache is restored.
    - shell: bash
      run: echo 'PUPPETEER_SKIP_DOWNLOAD=true' >> "$GITHUB_ENV"
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.browser == 'true'
      id: puppeteer
      shell: bash
      run: echo "version=$(node -p "require('puppeteer/package.json').version")" >> "$GITHUB_OUTPUT"
    - if: inputs.browser == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ steps.puppeteer.outputs.version }}
        restore-keys: puppeteer-${{ runner.os }}-
    - if: inputs.browser == 'true'
      shell: bash
      run: pnpm exec puppeteer browsers install chrome
    - if: inputs.docs-tools == 'true'
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      with:
        install_args: hugo zola mdbook
