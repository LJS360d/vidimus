name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'scripts/schema.ts', 'scripts/docs.ts', 'mise.toml', 'package.json', 'pnpm-lock.yaml', '.github/**']
  workflow_dispatch:

# Never cancel a run midway: that could interrupt a Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          docs-tools: 'true'
      - run: pnpm run build
      - run: pnpm run docs:build
      - run: pnpm run docs:audit
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      # The audit reads the page list from docs/dist: reuse the site the build job deployed.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - run: mkdir -p docs/dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C docs/dist
      - run: pnpm run build
      - name: Audit the deployed site
        run: >-
          pnpm run docs:audit security links privacy
          --origin https://ljs360d.github.io/vidimus
          --set severity.security=warn
