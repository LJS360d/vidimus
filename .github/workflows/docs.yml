name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'scripts/schema.ts', 'scripts/docs.ts', 'mise.toml', 'package.json', 'pnpm-lock.yaml', '.github/**']
  workflow_dispatch:
    inputs:
      update-shots:
        description: record a new shots baseline for the showcase pages
        type: boolean
        default: false

# Never cancel a run midway: that could interrupt a Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          docs-tools: 'true'
      - run: pnpm run build
      - run: pnpm run docs:build
      - run: pnpm run docs:audit
      # shots compares the showcase pages with the baseline a previous run saved in the cache.
      # With none (first run, evicted, or update-shots), this run records it first.
      - id: shots-baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vidimus/shots/baseline
          key: docs-shots-${{ github.run_id }}
          restore-keys: docs-shots-
      - id: shots-record
        if: steps.shots-baseline.outputs.cache-matched-key == '' || inputs.update-shots
        run: pnpm run docs:audit shots --update-baseline
      - run: pnpm run docs:audit shots
      - if: steps.shots-record.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vidimus/shots/baseline
          key: docs-shots-${{ github.run_id }}
      - run: node scripts/docs.ts pages-copies
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      # The audit reads the page list from docs/dist: reuse the site the build job deployed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - run: mkdir -p docs/dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C docs/dist
      - run: pnpm run build
      - name: Audit the deployed site
        run: >-
          pnpm run docs:audit security links privacy
          --origin https://ljs360d.github.io/vidimus
          --set severity.security=warn
