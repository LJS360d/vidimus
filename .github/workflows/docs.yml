name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'scripts/schema.ts', 'scripts/docs.ts', 'mise.toml', 'package.json', 'pnpm-lock.yaml', '.github/**']
  workflow_dispatch:

# Never cancel a run midway: that could interrupt a Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          docs-tools: 'true'
      - run: pnpm run docs:build
      # The audits read the build as it is, before the React and Angular route copies below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7
      - run: node scripts/docs.ts pages-copies
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  # The audits below do not gate the deployment: a finding on the docs should not hold back a
  # fix to them. They still fail the run, so the finding shows up on the commit.
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  audit:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: static
            audits: seo security html budget assets csp links
          - group: browser
            audits: a11y r12s privacy forms
          - group: lighthouse
            audits: lighthouse
    name: audit (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every group needs Chrome: the React and Angular pages are rendered before they are read.
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: docs/dist
      - run: pnpm run build
      - run: pnpm run docs:audit ${{ matrix.audits }}
      - if: always() && matrix.group == 'lighthouse'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: docs/.vidimus/lighthouse
          include-hidden-files: true
          if-no-files-found: ignore

  # Every deployment records the showcase screenshots as the baseline that pull requests compare
  # with (see ci.yml). It also reports what changed since the previous deployment, without failing.
  shots:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: docs/dist
      - run: pnpm run build
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vidimus/shots/baseline
          key: docs-shots-${{ github.sha }}
          restore-keys: docs-shots-
      - name: Compare with the previous deployment
        run: pnpm run docs:audit shots --set severity.shots=warn
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shots
          path: docs/.vidimus/shots
          include-hidden-files: true
          if-no-files-found: ignore
      - run: pnpm run docs:audit shots --update-baseline
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vidimus/shots/baseline
          key: docs-shots-${{ github.sha }}

  verify:
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      # The audit reads the page list from docs/dist: reuse the site the build job deployed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - run: mkdir -p docs/dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C docs/dist
      - run: pnpm run build
      - name: Audit the deployed site
        run: >-
          pnpm run docs:audit security links privacy
          --origin https://ljs360d.github.io/vidimus
          --set severity.security=warn
