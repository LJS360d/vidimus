name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'scripts/schema.ts', 'scripts/docs.ts', 'mise.toml', 'package.json', 'pnpm-lock.yaml', '.github/**']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          docs-tools: 'true'
      - run: pnpm run build
      - run: pnpm run docs:build
      - run: pnpm run docs:audit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          docs-tools: 'true'
      - run: pnpm run build
      - run: pnpm run docs:build
      - name: Audit the deployed site
        run: >-
          pnpm run docs:audit security links privacy
          --origin https://ljs360d.github.io/vidimus
          --set severity.security=warn
