name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm install -g npm@^11.5.1
      - run: pnpm run check
      - run: pnpm run smoke

      - name: Apply pending changesets
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            pnpm run bump
            version=$(node -p "require('./package.json').version")
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "chore(release): v$version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish to npm
        id: publish
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "vidimus@$version" version > /dev/null 2>&1; then
            echo "vidimus@$version is already on npm"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm run build
          npm publish --access public --ignore-scripts
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Tag and GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
