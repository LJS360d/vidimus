name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The browser tests are most of the coverage: without Chrome they are skipped.
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          browser: 'true'
      - run: pnpm run typecheck
      - run: pnpm run test:coverage

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm run lint
      - run: pnpm run knip
      - run: pnpm run build
      - run: pnpm run lint:pkg

  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          docs-tools: 'true'
      - run: pnpm run smoke
      - id: docs-build
        run: pnpm run docs:build
      - run: pnpm run docs:audit
      - if: ${{ !cancelled() && steps.docs-build.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vidimus/shots/baseline
          key: docs-shots-${{ github.sha }}
          restore-keys: docs-shots-
      - if: ${{ !cancelled() && steps.docs-build.outcome == 'success' }}
        run: pnpm run docs:audit shots --set severity.shots=warn
      - if: ${{ !cancelled() && steps.docs-build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shots
          path: docs/.vidimus/shots
          include-hidden-files: true
          if-no-files-found: ignore
