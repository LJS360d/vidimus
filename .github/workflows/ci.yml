name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm run check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm run smoke
      - run: pnpm run docs:build
      - run: pnpm run docs:audit
